<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#070b16"/>
      <stop offset="60%" stop-color="#0d1424"/>
      <stop offset="100%" stop-color="#050811"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#247bff"/>
      <stop offset="50%" stop-color="#60a5fa"/>
      <stop offset="100%" stop-color="#ff354f"/>
    </linearGradient>
    <linearGradient id="borderGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#247bff" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#ff354f" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#247bff" stop-opacity="0.1"/>
    </linearGradient>
    <pattern id="dotGrid" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#ffffff" opacity="0.06"/>
    </pattern>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <style>
      .mono { font-family: ui-monospace, SFMono-Regular, "Roboto Mono", Consolas, monospace; }
      .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
      @keyframes cycleRoles {
        0%, 20%   { opacity: 1; transform: translateY(0); }
        25%, 95%  { opacity: 0; transform: translateY(-8px); }
        100%      { opacity: 1; transform: translateY(0); }
      }
      @keyframes scanline {
        0% { transform: translateY(0); }
        100% { transform: translateY(520px); }
      }
      .role-1 { animation: cycleRoles 12s infinite 0s; }
      .role-2 { animation: cycleRoles 12s infinite 3s; opacity: 0; }
      .role-3 { animation: cycleRoles 12s infinite 6s; opacity: 0; }
      .role-4 { animation: cycleRoles 12s infinite 9s; opacity: 0; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="1200" height="520" rx="24" fill="url(#bgGrad)"/>
  <rect width="1200" height="520" rx="24" fill="url(#dotGrid)"/>
  <rect x="1" y="1" width="1198" height="518" rx="23" fill="none" stroke="url(#borderGrad)" stroke-width="1.5"/>

  <!-- Ambient Glow Orbs -->
  <circle cx="1080" cy="120" r="180" fill="#247bff" opacity="0.12" filter="url(#neonGlow)"/>
  <circle cx="920" cy="400" r="140" fill="#ff354f" opacity="0.08" filter="url(#neonGlow)"/>

  <!-- Terminal Status Header -->
  <g transform="translate(60, 55)">
    <circle cx="8" cy="8" r="5" fill="#ff354f">
      <animate attributeName="opacity" values="1;0.3;1" dur="1.5s" repeatCount="indefinite"/>
    </circle>
    <text x="24" y="12" class="mono" font-size="13" font-weight="600" fill="#60a5fa" letter-spacing="2">SYSTEM.ONLINE // UMER-YASIR.DEV</text>
    <text x="960" y="12" class="mono" font-size="13" fill="#64748b" text-anchor="end">LOC: LAHORE, PK [31.5204° N, 74.3587° E]</text>
  </g>

  <!-- Hero Main Content -->
  <g transform="translate(60, 140)">
    <text x="0" y="0" class="mono" font-size="18" fill="#94a3b8" letter-spacing="1">HI THERE, I'M</text>
    
    <!-- Large Name Reveal -->
    <text x="0" y="65" class="sans" font-size="64" font-weight="900" fill="#f8fafc" letter-spacing="-1">
      Umer <tspan fill="url(#accentGrad)">Yasir</tspan>
    </text>
    
    <!-- Dynamic Cycling Roles -->
    <g transform="translate(0, 115)">
      <rect x="0" y="-24" width="460" height="38" rx="8" fill="#0e172a" stroke="#1e293b"/>
      <circle cx="16" cy="-5" r="4" fill="#247bff"/>
      
      <text x="32" y="0" class="mono role-1" font-size="16" font-weight="600" fill="#38bdf8">Full Stack Software Engineer</text>
      <text x="32" y="0" class="mono role-2" font-size="16" font-weight="600" fill="#60a5fa">Java &amp; Spring Boot Specialist</text>
      <text x="32" y="0" class="mono role-3" font-size="16" font-weight="600" fill="#f472b6">React &amp; Next.js Architect</text>
      <text x="32" y="0" class="mono role-4" font-size="16" font-weight="600" fill="#34d399">Cloud &amp; Distributed Systems</text>
    </g>

    <!-- Pitch Statement -->
    <text x="0" y="175" class="sans" font-size="17" fill="#cbd5e1" font-weight="400">
      Engineering resilient backend microservices, robust REST APIs, and scalable enterprise platforms.
    </text>

    <!-- Meta Details Row -->
    <g transform="translate(0, 230)">
      <!-- Company Pill -->
      <rect x="0" y="0" width="220" height="42" rx="10" fill="#0f172a" stroke="#247bff" stroke-opacity="0.4"/>
      <text x="18" y="26" class="sans" font-size="14" font-weight="600" fill="#f8fafc">🏢 CodeHoppers</text>

      <!-- Status Pill -->
      <rect x="235" y="0" width="260" height="42" rx="10" fill="#0f172a" stroke="#334155"/>
      <circle cx="255" cy="21" r="4" fill="#22c55e"/>
      <text x="270" y="26" class="sans" font-size="14" fill="#94a3b8">Available for High-Impact Roles</text>
    </g>
  </g>

  <!-- Right Side Visual Identity Card -->
  <g transform="translate(820, 110)">
    <rect width="320" height="340" rx="20" fill="#0b1120" stroke="#1e293b" stroke-width="1.5"/>
    <rect x="1" y="1" width="318" height="338" rx="19" fill="none" stroke="url(#accentGrad)" stroke-opacity="0.25"/>
    
    <!-- Stylized Avatar Emblem -->
    <circle cx="160" cy="110" r="64" fill="#070b16" stroke="url(#accentGrad)" stroke-width="3"/>
    <circle cx="160" cy="110" r="54" fill="#0f172a"/>
    <text x="160" y="125" class="sans" font-size="38" font-weight="900" fill="url(#accentGrad)" text-anchor="middle">UY</text>

    <!-- ID Badge Data -->
    <text x="160" y="210" class="sans" font-size="20" font-weight="800" fill="#f8fafc" text-anchor="middle">UMER YASIR</text>
    <text x="160" y="235" class="mono" font-size="13" fill="#60a5fa" text-anchor="middle">ENGINEER // BACKEND &amp; WEB</text>

    <!-- Core Tags -->
    <g transform="translate(25, 265)">
      <rect x="0" y="0" width="80" height="28" rx="6" fill="#1e293b"/>
      <text x="40" y="18" class="mono" font-size="11" fill="#94a3b8" text-anchor="middle">JAVA</text>

      <rect x="90" y="0" width="85" height="28" rx="6" fill="#1e293b"/>
      <text x="132" y="18" class="mono" font-size="11" fill="#94a3b8" text-anchor="middle">SPRING</text>

      <rect x="185" y="0" width="85" height="28" rx="6" fill="#1e293b"/>
      <text x="227" y="18" class="mono" font-size="11" fill="#94a3b8" text-anchor="middle">REACT</text>
    </g>
  </g>
</svg>
