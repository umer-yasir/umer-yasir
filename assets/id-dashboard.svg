<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="480" viewBox="0 0 1200 480">
  <defs>
    <linearGradient id="dashBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#070b16"/>
      <stop offset="100%" stop-color="#0a101d"/>
    </linearGradient>
    <linearGradient id="metalGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#475569"/>
      <stop offset="50%" stop-color="#cbd5e1"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>
    <linearGradient id="badgeAccent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#247bff"/>
      <stop offset="100%" stop-color="#ff354f"/>
    </linearGradient>
    <style>
      .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
      .mono { font-family: ui-monospace, SFMono-Regular, Consolas, monospace; }
      @keyframes lanyardSwing {
        0%   { transform: rotate(-1.5deg); }
        50%  { transform: rotate(1.5deg); }
        100% { transform: rotate(-1.5deg); }
      }
      .hanging-badge {
        transform-origin: 220px 0px;
        animation: lanyardSwing 5s ease-in-out infinite;
      }
    </style>
  </defs>

  <rect width="1200" height="480" rx="20" fill="url(#dashBg)" stroke="#1e293b" stroke-width="1.5"/>

  <!-- Left: Hanging ID Card with Metal Clasp -->
  <g class="hanging-badge">
    <!-- Lanyard Strap -->
    <rect x="208" y="0" width="24" height="60" fill="#1e293b" stroke="#334155"/>
    <!-- Metal Clasp -->
    <rect x="200" y="55" width="40" height="18" rx="4" fill="url(#metalGrad)"/>
    <circle cx="220" cy="64" r="4" fill="#0f172a"/>

    <!-- ID Badge Body -->
    <g transform="translate(80, 80)">
      <rect width="280" height="360" rx="16" fill="#0d1424" stroke="#334155" stroke-width="2"/>
      <rect x="1" y="1" width="278" height="358" rx="15" fill="none" stroke="url(#badgeAccent)" stroke-opacity="0.3"/>

      <!-- Photo Frame / Initials -->
      <rect x="65" y="30" width="150" height="150" rx="14" fill="#070b16" stroke="url(#badgeAccent)" stroke-width="2"/>
      <circle cx="140" cy="105" r="50" fill="#0f172a"/>
      <text x="140" y="118" class="sans" font-size="36" font-weight="900" fill="url(#badgeAccent)" text-anchor="middle">UY</text>

      <text x="140" y="215" class="sans" font-size="20" font-weight="800" fill="#f8fafc" text-anchor="middle">UMER YASIR</text>
      <text x="140" y="238" class="mono" font-size="12" font-weight="600" fill="#60a5fa" text-anchor="middle">SOFTWARE ENGINEER</text>

      <!-- Barcode Graphic -->
      <g transform="translate(45, 270)">
        <rect x="0" y="0" width="4" height="40" fill="#94a3b8"/>
        <rect x="8" y="0" width="8" height="40" fill="#94a3b8"/>
        <rect x="20" y="0" width="3" height="40" fill="#94a3b8"/>
        <rect x="28" y="0" width="6" height="40" fill="#94a3b8"/>
        <rect x="40" y="0" width="10" height="40" fill="#94a3b8"/>
        <rect x="55" y="0" width="4" height="40" fill="#94a3b8"/>
        <rect x="64" y="0" width="8" height="40" fill="#94a3b8"/>
        <rect x="78" y="0" width="4" height="40" fill="#94a3b8"/>
        <rect x="88" y="0" width="12" height="40" fill="#94a3b8"/>
        <rect x="105" y="0" width="5" height="40" fill="#94a3b8"/>
        <rect x="115" y="0" width="8" height="40" fill="#94a3b8"/>
        <rect x="130" y="0" width="6" height="40" fill="#94a3b8"/>
        <rect x="142" y="0" width="10" height="40" fill="#94a3b8"/>
        <rect x="158" y="0" width="4" height="40" fill="#94a3b8"/>
        <rect x="168" y="0" width="8" height="40" fill="#94a3b8"/>
        <rect x="180" y="0" width="10" height="40" fill="#94a3b8"/>
      </g>
      <text x="140" y="325" class="mono" font-size="10" fill="#64748b" text-anchor="middle">AUTH-ID // 9842-UY-2026</text>
    </g>
  </g>

  <!-- Right: Verified Metrics & Engineering Snapshot -->
  <g transform="translate(450, 60)">
    <text x="0" y="20" class="mono" font-size="13" font-weight="700" fill="#247bff" letter-spacing="2">04 // VERIFIED ENGINEERING METRICS</text>
    <text x="0" y="55" class="sans" font-size="26" font-weight="800" fill="#f8fafc">Technical Snapshot &amp; Status</text>

    <!-- Metric Cards -->
    <g transform="translate(0, 90)">
      <!-- Card 1 -->
      <rect width="320" height="110" rx="14" fill="#0d1424" stroke="#1e293b"/>
      <text x="25" y="38" class="mono" font-size="12" fill="#94a3b8">PRIMARY DOMAIN</text>
      <text x="25" y="72" class="sans" font-size="20" font-weight="700" fill="#60a5fa">Enterprise Backends</text>
      <text x="25" y="94" class="mono" font-size="12" fill="#64748b">Java • Spring • REST APIs</text>

      <!-- Card 2 -->
      <g transform="translate(345, 0)">
        <rect width="320" height="110" rx="14" fill="#0d1424" stroke="#1e293b"/>
        <text x="25" y="38" class="mono" font-size="12" fill="#94a3b8">ORGANIZATION</text>
        <text x="25" y="72" class="sans" font-size="20" font-weight="700" fill="#34d399">CodeHoppers</text>
        <text x="25" y="94" class="mono" font-size="12" fill="#64748b">Lahore, Pakistan</text>
      </g>

      <!-- Card 3 -->
      <g transform="translate(0, 130)">
        <rect width="320" height="110" rx="14" fill="#0d1424" stroke="#1e293b"/>
        <text x="25" y="38" class="mono" font-size="12" fill="#94a3b8">WEB ARCHITECTURE</text>
        <text x="25" y="72" class="sans" font-size="20" font-weight="700" fill="#f472b6">Full Stack React/Next</text>
        <text x="25" y="94" class="mono" font-size="12" fill="#64748b">SSR • Server Actions • Tailwind</text>
      </g>

      <!-- Card 4 -->
      <g transform="translate(345, 130)">
        <rect width="320" height="110" rx="14" fill="#0d1424" stroke="#1e293b"/>
        <text x="25" y="38" class="mono" font-size="12" fill="#94a3b8">INFRASTRUCTURE</text>
        <text x="25" y="72" class="sans" font-size="20" font-weight="700" fill="#fbbf24">AWS &amp; Docker</text>
        <text x="25" y="94" class="mono" font-size="12" fill="#64748b">Nginx • PM2 • Linux</text>
      </g>
    </g>
  </g>
</svg>
